<!-- ===== 顶栏 ===== -->
<header class="topbar">
  <div class="brand">
    <span class="brand-text">MOTE跑团日历</span>
  </div>

  <nav class="nav" id="nav">
    <button class="nav-btn is-active" data-view="calendar"><svg class="ic"><use href="#i-calendar"/></svg><span>日历</span></button>
    <button class="nav-btn" data-view="modules"><svg class="ic"><use href="#i-layers"/></svg><span>模组</span></button>
    <button class="nav-btn" data-view="stats"><svg class="ic"><use href="#i-chart"/></svg><span>统计</span></button>
    <button class="nav-btn" data-view="settings"><svg class="ic"><use href="#i-settings"/></svg><span>设置</span></button>
  </nav>

  <div class="topbar-right">
    <button class="btn btn-sm" id="btnReload" title="检查更新">
      <svg class="ic"><use href="#i-undo"/></svg><span>检查更新</span>
    </button>
    <button class="btn btn-primary" id="btnQuickAdd" title="新建日程">
      <svg class="ic"><use href="#i-plus"/></svg><span>新建日程</span>
    </button>
  </div>
</header>

<!-- ===== 主体 ===== -->
<main id="viewRoot" class="view-root"></main>

<!-- ===== 弹层 / 提示 ===== -->
<div id="modalRoot"></div>
<div id="toastRoot" class="toast-root"></div>
